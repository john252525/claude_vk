<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VK Messages{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #edeef0; color: #222; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        header { background: #4a76a8; color: #fff; padding: 16px 0; margin-bottom: 16px; }
        header .container { display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 20px; font-weight: 600; }
        header a { color: #fff; text-decoration: none; font-size: 14px; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
        a.card { display: block; text-decoration: none; color: inherit; }
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .card-meta { font-size: 13px; color: #818c99; }
        .msg { padding: 10px 14px; margin-bottom: 6px; border-radius: 12px; max-width: 75%; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.out { background: #d6eaff; margin-left: auto; }
        .msg.in { background: #fff; border: 1px solid #e1e3e6; }
        .msg-date { font-size: 11px; color: #818c99; margin-top: 2px; }
        .msg-from { font-size: 12px; color: #4a76a8; font-weight: 600; margin-bottom: 2px; }
        .badge { display: inline-block; background: #4a76a8; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .back { display: inline-block; margin-bottom: 12px; color: #4a76a8; text-decoration: none; font-size: 14px; }
        .back:hover { text-decoration: underline; }
        .empty { text-align: center; padding: 40px; color: #818c99; }
        .api-links { margin-top: 16px; padding: 12px; background: #fff; border-radius: 8px; font-size: 13px; }
        .api-links a { color: #4a76a8; margin-right: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>VK Group Messages</h1>
            <div>
                <a href="/">All Chats</a>
                <a href="/logout" style="margin-left:16px; opacity:.7;">Logout</a>
            </div>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
